# Shared between the plain-HTTP server block and the TLS (443) server block
# added dynamically by docker-entrypoint.d/45-tls.sh — keeps routing rules in
# one place instead of duplicated per port.

# API traffic -> offerservice
location /api/ {
    proxy_set_header Host offerservice;
    proxy_pass http://offerservice/;
    proxy_read_timeout 60s;
}

# Auth / OAuth flow -> offerservice
location /auth/ {
    proxy_set_header Host offerservice;
    proxy_pass http://offerservice/auth/;
    proxy_read_timeout 60s;
}

# Health endpoint of offerservice (gateway-level probe)
location /health {
    proxy_set_header Host offerservice;
    proxy_pass http://offerservice/health;
}

# Next.js app's own assets — must win over the static-extension rule below,
# since /_next/static/*.js etc would otherwise match it and go to `frontend`.
location ^~ /_next/ {
    proxy_set_header Host nextapp;
    proxy_pass http://nextapp;
}

# Admin panel — stays on the existing CRA app/container, unchanged.
location /admin/ {
    proxy_set_header Host frontend;
    proxy_pass http://frontend;
}

# Any static asset request (CRA JS/CSS bundle under /static/, favicon,
# manifest.json, and blog/reference/upload media served from frontend's own
# nginx, whether from the mounted storage volume or its bundled public/) ->
# frontend, unchanged. Placed before the nextapp catch-all so page routes
# like /blog and /blog/:slug (no extension) still go to nextapp.
location ~* \.(jpe?g|png|gif|webp|svg|avif|ico|mp4|webm|css|js|map|json|woff2?|ttf)$ {
    proxy_set_header Host frontend;
    proxy_pass http://frontend;
}

# Everything else (public pages, robots.txt, sitemap.xml, llms.txt) -> Next.js SSR app
location / {
    proxy_set_header Host nextapp;
    proxy_pass http://nextapp;
}
