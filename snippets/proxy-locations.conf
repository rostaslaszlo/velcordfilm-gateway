# Shared between the plain-HTTP server block and the TLS (443) server block
# added dynamically by docker-entrypoint.d/45-tls.sh — keeps routing rules in
# one place instead of duplicated per port.
#
# FONTOS: ha egy location saját proxy_set_header-t ad meg (itt mind a Host-ot), nginx NEM örökli a
# server-szintű proxy_set_header-öket (nginx.conf) — ezért az offerservice-es location-ök a
# kliens-IP fejléceket is újra megadják. Enélkül az offerservice minden látogatót a gateway IP-jének
# látna, és a rate limitek (pl. galéria-jelszó, email-küldés) mindenkire közösen számolnának.
# A "proxy_set_header Host offerservice;" sort egyetlen szóközzel kell írni, mert a
# docker-entrypoint.d/41-upstream-hosts.sh pontosan erre a szövegre cserél.

# API traffic -> offerservice
location /api/ {
    # a galéria ZIP-letöltése folyamatosan, képenként készül (X-Accel-Buffering: no), a sok képes
    # ZIP-ek miatt kell a hosszabb timeout
    proxy_set_header Connection         "";
    proxy_set_header Host offerservice;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_pass http://offerservice/;
    proxy_read_timeout 300s;
}

# Auth / OAuth flow -> offerservice
location /auth/ {
    proxy_set_header Connection         "";
    proxy_set_header Host offerservice;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_pass http://offerservice/auth/;
    proxy_read_timeout 60s;
}

# WebDAV (photobox feltöltés, rclone) -> offerservice. Nagyobb body-limit és hosszabb
# timeout kell a fényképekhez; proxy_pass tetszőleges HTTP metódust (PROPFIND, PUT, MKCOL...)
# átenged, nincs szükség nginx dav modulra. ^~ kell, hogy a lenti .jpg/.png regex location
# (ami a static asset kiszolgálásra van) ne előzze meg ezt a fájlkiterjesztéssel végződő
# fájlnevek (pl. /dav/photo.jpg) esetén — a prefix location így garantáltan nyer.
# Nincs URI rész a proxy_pass-ban, így az eredeti /dav[/...] útvonal változatlanul megy át,
# egyezve az offerservice /dav és /dav/* route-jaival (a bare /dav root PROPFIND-hoz is kell).
location ^~ /dav {
    proxy_set_header Connection         "";
    proxy_set_header Host offerservice;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_pass http://offerservice;
    client_max_body_size 50m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Photobox fájlok közvetlen kiszolgálása a mountolt storage volume-ról, app-overhead nélkül —
# NEM internal: a teljes relatív útvonal (pl. .../processed_full/...) egyértelműen egy konkrét
# fájlra mutat (device-id + eredeti útvonal), ezért ez közvetlenül is böngészhető/linkelhető
# (admin fájllista lenyitott nézete), NEM csak X-Accel-Redirect célpontként. ^~ KRITIKUS: az
# X-Accel-Redirect belső átirányítás is a normál location-matcheléssel megy, tehát enélkül a
# lenti .jpg/.png kiterjesztés-regex előzné meg (mivel ^~ nélkül a prefix-match után is
# lefutnak a regex location-ök) — ekkor a `frontend`-hez menne (aminek fogalma sincs erről az
# útvonalról), 200-as, de rossz (frontend saját statikus fallback-je) választ adva vissza.
location ^~ /photobox-files/ {
    alias /app/storage/photobox/;
}

# Storage gyökere, CSAK X-Accel-Redirect célpontként (internal — kívülről 404): az offerservice
# ellenőrzi a hozzáférést (pl. jelszavas vendéggaléria), utána a bájtokat az nginx küldi közvetlenül
# a lemezről (lásd offerservice photobox/delivery/send.ts). ^~ ugyanazért kell, mint a
# /photobox-files/-nál: a belső átirányítás is normál location-matchelés, a lenti kiterjesztés-regex
# különben elvinné a frontendhez.
location ^~ /_storage/ {
    internal;
    alias /app/storage/;
}

# A vendégeknek szóló photobox OLDALAK (QR-kódos egyedi kép: /photobox/kep/<eszköz>/<fájl>) a
# Next.js weboldalé — az offerservice csak az API-t adja (/api/photobox/...). ^~ kell, mert a QR-ben
# lehet kiterjesztéses fájlnév is (.../20260817-103948.jpg), amit a lenti regex a frontendhez vinne.
# A vendéggaléria oldalai (/g/<slug>) külön location nélkül, a `/` catch-all-on át mennek a Next.js-hez.
location ^~ /photobox/kep/ {
    proxy_set_header Host nextapp;
    proxy_pass http://nextapp;
}

# Publikus, username+fájlnév-alapú letöltés (pl. QR-kód) -> offerservice dönti el melyik fájlról
# van szó (a processed_full változatot részesíti előnyben — ha ugyanaz a fájlnév több almappában
# is szerepel, ez az egyértelmű, megosztásra szánt találat). X-Accel-Redirect a fenti
# /photobox-files/ location-re. ^~ ugyanazért kell, mint a /dav-nál: a lenti kiterjesztés-regex
# (.jpg stb.) különben megelőzné a /photobox/kep.jpg-szerű útvonalakat. FONTOS: nem ütközik a
# fenti /photobox-files/ location-nel — nginx a leghosszabb egyező prefixet választja, ott mindig
# az hosszabb (16 vs 9 karakter) fog nyerni egy /photobox-files/... kérésnél.
location ^~ /photobox {
    proxy_set_header Connection         "";
    proxy_set_header Host offerservice;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_pass http://offerservice;
}

# Health endpoint of offerservice (gateway-level probe)
location /health {
    proxy_set_header Connection         "";
    proxy_set_header Host offerservice;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_pass http://offerservice/health;
}

# Next.js app's own assets — must win over the static-extension rule below,
# since /_next/static/*.js etc would otherwise match it and go to `frontend`.
location ^~ /_next/ {
    proxy_set_header Host nextapp;
    proxy_pass http://nextapp;
}

# Admin panel — stays on the existing CRA app/container, unchanged.
location /admin/ {
    proxy_set_header Host frontend;
    proxy_pass http://frontend;
}

# Any static asset request (CRA JS/CSS bundle under /static/, favicon,
# manifest.json, and blog/reference/upload media served from frontend's own
# nginx, whether from the mounted storage volume or its bundled public/) ->
# frontend, unchanged. Placed before the nextapp catch-all so page routes
# like /blog and /blog/:slug (no extension) still go to nextapp.
location ~* \.(jpe?g|png|gif|webp|svg|avif|ico|mp4|webm|css|js|map|json|woff2?|ttf)$ {
    proxy_set_header Host frontend;
    proxy_pass http://frontend;
}

# Everything else (public pages, robots.txt, sitemap.xml, llms.txt) -> Next.js SSR app
location / {
    proxy_set_header Host nextapp;
    proxy_pass http://nextapp;
}
