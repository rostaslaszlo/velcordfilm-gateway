# Let's Encrypt HTTP-01 challenge. Must stay reachable over plain HTTP even
# after TLS is fully enabled (renewals use the same challenge again later).
# auth_basic off keeps this outside basic auth even when the staging config
# (02-basic-auth.conf) is also active on this environment.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    auth_basic off;
}
