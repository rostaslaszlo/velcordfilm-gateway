events {}

http {
    # Staging-only http-szintű config (pl. AI bot user-agent map) – üres production-ben
    include /etc/nginx/conf.d/http-extra/*.conf;

    # TLS (443) server blokk – csak akkor létezik ez a fájl, ha docker-entrypoint.d/
    # 45-tls.sh TLS_DOMAIN-t talált ÉS a tanúsítvány már megvan (lásd ott). Üres
    # könyvtár = nincs 443 blokk egyáltalán (pl. Azure Container Apps, ahol a
    # platform terminálja a TLS-t, ez a gateway image sosem futtatja ezt a részt).
    include /etc/nginx/conf.d/tls-server/*.conf;

    # Az upstream-ek címét futás közben is újra kikeressük (`resolve` + `zone`, open source
    # nginx 1.27.3 óta) — enélkül az nginx csak induláskor oldja fel a service-neveket, és egy
    # offerservice/frontend/nextapp konténer-újraindítás után (új belső IP) a régi címre küld
    # tovább: 502 minden kérésre, amíg a gateway-t is újra nem indítják. Bónusz: a gateway akkor
    # is elindul, ha egy upstream még nem fut (addig 502, utána magától elérhetővé válik).
    # A resolver címét a docker-entrypoint.d/41-upstream-hosts.sh az /etc/resolv.conf-ból írja
    # felül; a 127.0.0.11 a Docker belső DNS-e, docker-compose alatt ez a helyes érték.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream frontend {
        zone upstream_frontend 64k;
        server frontend:80 resolve;
    }

    upstream offerservice {
        zone upstream_offerservice 64k;
        server offerservice:3000 resolve;
    }

    # Next.js SSR app — serves the public-facing pages (SEO alternative,
    # feature/nextjs-ssr branch). Admin (/admin/*) and CRA static assets keep
    # going to `frontend`, unchanged.
    upstream nextapp {
        zone upstream_nextapp 64k;
        server nextapp:3000 resolve;
    }

    # www.velcord.hu + a másodlagos márkadomainek → mind a velcord.hu-ra
    # redirectelnek (301). A velcord.hu (és staging/default FQDN) a lenti
    # catch-all server blokkban marad, és megy tovább a frontendre/offerservice-re.
    server {
        listen 80;
        server_name
            www.velcord.hu
            arcmedia.hu www.arcmedia.hu
            velcordfilm.hu www.velcordfilm.hu
            velcordmedia.hu www.velcordmedia.hu
            velcordfilmstudio.hu www.velcordfilmstudio.hu;

        server_tokens off;

        return 301 https://velcord.hu$request_uri;
    }

    server {
        listen 80 default_server;
        server_name _;

        server_tokens off;

        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Staging-only server-szintű config (basic auth, noindex, AI bot tiltás) –
        # üres production-ben. Ugyanez a directory a 443-as blokkban is
        # includeolva van (lásd tls-available/tls-server/50-https.conf.template),
        # hogy TLS esetén se HTTP-n, se HTTPS-en ne lehessen megkerülni.
        include /etc/nginx/conf.d/server-extra/*.conf;

        # Csak a plain-HTTP listenerre való dolgok: ACME HTTP-01 challenge +
        # (ha már van cert) a HTTPS-re redirect. docker-entrypoint.d/45-tls.sh
        # tölti fel – lásd tls-available/port80-extra/ a gateway repóban. NEM
        # kerülhet be a server-extra-ba, mert a 443-as blokk is includeolja
        # azt, és a redirect ott végtelen ciklust okozna (https -> https).
        include /etc/nginx/conf.d/port80-extra/*.conf;

        include /etc/nginx/snippets/proxy-locations.conf;
    }
}
